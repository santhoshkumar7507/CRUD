<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentCore | Student Information System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <span class="logo-icon">🎓</span>
                <div class="brand-text">
                    <h1>StudentCore</h1>
                    <span class="badge-pro">SIS</span>
                </div>
            </div>
            <div class="nav-actions">
                <button id="theme-toggle" class="btn-icon" title="Toggle Theme">🌙</button>
                <div class="user-profile" title="Current User">
                    <img src="https://ui-avatars.com/api/?name=Admin&background=2563eb&color=fff" alt="Admin" class="avatar">
                    <span class="username">Admin User</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Layout -->
    <div class="app-wrapper">
        <div class="app-container">
            
            <!-- Sidebar / Action Panel -->
            <aside class="action-panel glass-panel">
                <div class="panel-header">
                    <h2>Student Registration</h2>
                    <p>Add a new student or update an existing record.</p>
                </div>
                <form id="student-form">
                    <div class="input-group">
                        <label for="id">Student ID</label>
                        <input type="number" id="id" placeholder="e.g. 101" required>
                    </div>
                    <div class="input-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="John Doe" required>
                    </div>
                    <div class="input-group">
                        <label for="age">Age</label>
                        <input type="number" id="age" placeholder="20" required>
                    </div>
                    <div class="input-group">
                        <label for="course">Program / Course</label>
                        <input type="text" id="course" placeholder="Computer Science" required>
                    </div>
                    <button type="submit" class="btn-primary">Save Record</button>
                </form>
                <div id="status-message"></div>
            </aside>

            <!-- Main Data View -->
            <main class="data-view">
                <div class="view-header">
                    <div>
                        <h2>Enrolled Directory</h2>
                        <p class="subtitle">Manage all active student profiles.</p>
                    </div>
                    <div class="view-actions">
                        <button class="btn-secondary" onclick="window.location.reload()">🔄 Refresh</button>
                    </div>
                </div>
                
                <div id="student-grid" class="student-grid">
                    <!-- Student cards will be injected here via JavaScript -->
                    <div class="empty-state">Loading database...</div>
                </div>
            </main>

        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
